else{const pin=d.pin.trim(),w=await rpc('act',{p_code:pin,p_action:'whoami',p:{}});if(d.r=='admin'&&w.role!='admin')throw Error('Ese código no es del equipo Vybra');role=w.role;orgName=w.name;CODE=pin;try{sessionStorage.setItem('vy',pin)}catch(e){}}}

else if(k=='reg'){const em=d.em.trim().toLowerCase();await rpc('register',{p_eid:f.dataset.id,p_name:d.nm.trim(),p_email:em,p_dist:d.dist||'',p_lic:(d.lic||'').trim()});S.reg.push({eid:f.dataset.id,email:em});S.me={name:d.nm.trim(),email:em};toast('Inscripción confirmada')}
else if(k=='post'){const e0=S.ev.find(x=>x.id==f.dataset.id);if(canMod(e0))await act('post',{eid:e0.id,c:d.c,x:d.x.trim(),re:replyTo||''});else await rpc('post_msg',{p_eid:e0.id,p_email:S.me.email,p_c:d.c,p_x:d.x.trim(),p_re:replyTo||''});replyTo=null;toast('Mensaje publicado')}
else if(k=='live'){await act('live',{eid:f.dataset.id,x:d.x.trim()});toast('Actualización publicada')}
else if(k=='loc'){const c=gmc(d.gm,1);if(!c){toast('No pude leer la ubicación');return}await act('set_loc',{eid:f.dataset.id,lat:c[0],lon:c[1]});toast('Ubicación actualizada')}
else if(k=='bulk'){let n=0;for(const l of d.b.split('\n')){const p=l.split(/[;|\t]/);if(p.length<2)continue;const q=p[0].trim().toLowerCase(),c=gmc(p.slice(1).join(';'),1),e=q&&S.ev.find(x=>x.nm.toLowerCase().includes(q)||q.includes(x.nm.toLowerCase()));if(c&&e){await act('set_loc',{eid:e.id,lat:c[0],lon:c[1]});n++}}toast(n+' ubicaciones actualizadas')}
else if(k=='news'){await act('add_news',{c:d.c,t:d.t.trim(),a:d.a.trim(),x:d.x.trim()});toast('Noticia publicada')}
else if(k=='svc'){const v=SERV.find(x=>x.id==f.dataset.s);await rpc('request_service',{p_s:v.n,p_c:d.c,p_em:d.em.trim()});if(v.link)window.open(v.link,'_blank','noopener');toast(v.link?'Abriendo el pago…':'Solicitud enviada: te contactaremos')}
else if(k=='org'){const r=await act('add_org',{name:d.name.trim()});alert('Código de acceso de '+d.name.trim()+': '+r.code+'\nGuárdalo y pásaselo al organizador: no se vuelve a mostrar.')}
await load();save();render()}catch(x){toast(x.message||'Error de conexión')}});
(async()=>{if(CODE){try{const w=await act('whoami');role=w.role;orgName=w.name}catch(e){CODE=''}}await load();render()})();
let sig='';setInterval(async()=>{if(document.hidden||dr||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;await load();const g=JSON.stringify([S.ev.length,S.posts.length,S.live.length,S.news.length,S.cnt]);if(g!=sig){sig=g;render()}},10000);
const tick=()=>{const n=new Date();$('clk').innerHTML=n.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+'<br><b>'+n.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</b>'};tick();setInterval(tick,1000);
render();

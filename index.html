function gcal(x){const d=x.dt.replace(/-/g,''),t=(x.hora||'').replace(':','');let dates;if(t.length>=4){const h=+t.slice(0,2);dates=d+'T'+t.slice(0,4)+'00/'+d+'T'+p2(Math.min(23,h+3))+t.slice(2,4)+'00'}else{const n=new Date(x.dt+'T00:00');n.setDate(n.getDate()+1);dates=d+'/'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())}
return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.nm)+'&dates='+dates+'&location='+encodeURIComponent((x.loc?x.loc+', ':'')+(x.pv||''))+'&details='+encodeURIComponent((x.url?'Web oficial: '+x.url:'')+(x.cierre?'\nCierre de inscripción: '+x.cierre:''))}
const icsEsc=s=>String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsText(items){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vybra//ES','CALSCALE:GREGORIAN'],st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
items.forEach(i=>{const d=i.dt.replace(/-/g,''),t=(i.hora||'').replace(':','');L.push('BEGIN:VEVENT','UID:'+eidOf(i)+'@vybra','DTSTAMP:'+st);
if(t.length>=4)L.push('DTSTART;TZID=Europe/Madrid:'+d+'T'+t.slice(0,4)+'00','DTEND;TZID=Europe/Madrid:'+d+'T'+p2(Math.min(23,+t.slice(0,2)+3))+t.slice(2,4)+'00');else{const n=new Date(i.dt+'T00:00');n.setDate(n.getDate()+1);L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate()))}
L.push('SUMMARY:'+icsEsc(i.nm),'LOCATION:'+icsEsc((i.loc?i.loc+', ':'')+(i.pv||'')),'DESCRIPTION:'+icsEsc((i.url?'Web oficial: '+i.url:'')+(i.cierre?'\nCierre de inscripción: '+i.cierre:'')),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(i.nm+' es mañana'),'TRIGGER:-P1D','END:VALARM','END:VEVENT')});L.push('END:VCALENDAR');return L.join('\r\n')}
const dl=(n,t,c)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t+';charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();a.remove()};
const feedUrl=()=>S.me?SB.replace('https://','webcal://')+'/functions/v1/api/calendar.ics?t='+S.me.ics_token:'';
const gmc=(u,any)=>{u=(u||'').trim();for(const r of[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/,/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/]){const m=u.match(r);if(m&&(any||(+m[1]>27&&+m[1]<44.5&&+m[2]>-19&&+m[2]<5)))return[+m[1],+m[2]]}return null};
const gmu=e=>'https://www.google.com/maps/search/?api=1&query='+(e.ex?e.lat+','+e.lon:encodeURIComponent([e.nm,e.loc,e.pv,'España'].filter(Boolean).join(' ')));
/* ---- mapa: Mapbox (o mapa provisional si no hay token) ---- */
const geo=()=>({type:'FeatureCollection',features:S.ev.filter(vis).filter(e=>e.lat!=null).map(e=>({type:'Feature',properties:{id:e.id,nm:e.nm,dt:e.dt,cd:cdTxt(e)},geometry:{type:'Point',coordinates:[e.lon,e.lat]}}))});
function killMap(){if(MAP){try{MAP.remove()}catch(e){}MAP=null}}
function updCount(){var n=S.ev.filter(vis).length,c=$('mcnt');if(c)c.textContent=n+(n==1?' prueba':' pruebas')+(region=='España'?' en España':' en '+region)}
function initMap(){var el=$('map');if(!el)return;killMap();
if(MAPBOX_TOKEN&&window.mapboxgl){el.className='mbx';mapboxgl.accessToken=MAPBOX_TOKEN;var light=document.documentElement.dataset.theme=='light';
MAP=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/'+(light?'streets-v12':'satellite-streets-v12'),center:region=='Andalucía'?[-4.7,37.4]:[-3.7,40.2],zoom:region=='Andalucía'?6.6:5.2});
MAP.addControl(new mapboxgl.NavigationControl(),'top-right');MAP.addControl(new mapboxgl.GeolocateControl({trackUserLocation:false}),'top-right');
MAP.on('load',function(){MAP.addSource('ev',{type:'geojson',data:geo(),cluster:true,clusterMaxZoom:11,clusterRadius:48});
MAP.addLayer({id:'cl',type:'circle',source:'ev',filter:['has','point_count'],paint:{'circle-color':'#E5121B','circle-radius':['step',['get','point_count'],20,10,26,30,32],'circle-stroke-width':3,'circle-stroke-color':'#fff'}});
MAP.addLayer({id:'cn',type:'symbol',source:'ev',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':14},paint:{'text-color':'#fff'}});
MAP.addLayer({id:'pt',type:'circle',source:'ev',filter:['!',['has','point_count']],paint:{'circle-color':'#E5121B','circle-radius':9,'circle-stroke-width':3,'circle-stroke-color':'#fff'}});
MAP.on('click','cl',function(e){var f=MAP.queryRenderedFeatures(e.point,{layers:['cl']})[0];MAP.getSource('ev').getClusterExpansionZoom(f.properties.cluster_id,function(er,z){if(!er)MAP.easeTo({center:f.geometry.coordinates,zoom:z+.5})})});
MAP.on('click','pt',function(e){var p=e.features[0].properties;new mapboxgl.Popup({offset:12}).setLngLat(e.features[0].geometry.coordinates).setHTML('<b>'+esc(p.nm)+'</b><br>'+esc(p.dt)+' · '+esc(p.cd)+'<br><a href="#" data-a="ev" data-v="'+esc(p.id)+'">Ver la prueba</a>').addTo(MAP)});
MAP.on('mouseenter','pt',function(){MAP.getCanvas().style.cursor='pointer'});MAP.on('mouseleave','pt',function(){MAP.getCanvas().style.cursor=''})})}
else fbDraw();updCount()}
function refreshMap(){if(MAP&&MAP.getSource&&MAP.getSource('ev'))MAP.getSource('ev').setData(geo());else if(!MAP)fbDraw();updCount()}
function mp(la,lo,z){var s=256*Math.pow(2,z),r=la*Math.PI/180;return[(lo+180)/360*s,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s]}
function un(x,y,z){var s=256*Math.pow(2,z),n=Math.PI-2*Math.PI*y/s;return[180/Math.PI*Math.atan(Math.sinh(n)),x/s*360-180]}
function fbDraw(){var m=$('map');if(!m||MAP)return;if(!m.dataset.fb){m.dataset.fb=1;m.innerHTML='<div id="lay"><div id="tiles"></div></div><div class="zc" style="right:10px"><button data-a="z" data-v="1" aria-label="Acercar">+</button><button data-a="z" data-v="-1" aria-label="Alejar">−</button></div><div class="mnote">Mapa provisional. Para activar Mapbox, pega tu token público en <b>MAPBOX_TOKEN</b>.</div>'}
var w=m.clientWidth,h=m.clientHeight,c=mp(fb.C[0],fb.C[1],fb.Z),x0=c[0]-w/2,y0=c[1]-h/2,n=Math.pow(2,fb.Z),t='';
for(var x=Math.floor(x0/256);x<=Math.floor((x0+w)/256);x++)for(var y=Math.floor(y0/256);y<=Math.floor((y0+h)/256);y++){if(y<0||y>=n)continue;t+='<img draggable="false" alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+fb.Z+'/'+y+'/'+(((x%n)+n)%n)+'" style="left:'+Math.round(x*256-x0)+'px;top:'+Math.round(y*256-y0)+'px" onerror="this.remove()">'}
S.ev.filter(vis).forEach(function(e){if(e.lat==null)return;var p=mp(e.lat,e.lon,fb.Z);t+='<button class="fbp" data-a="ev" data-v="'+esc(e.id)+'" title="'+esc(e.nm)+'" style="left:'+(p[0]-x0)+'px;top:'+(p[1]-y0)+'px"></button>'});
$('tiles').innerHTML=t;$('lay').style.transform=''}
let dr=null;
document.addEventListener('pointerdown',function(e){if(!MAP&&e.target.closest('#map')&&!e.target.closest('.zc,.fbp'))dr={x:e.clientX,y:e.clientY}});
addEventListener('pointermove',function(e){if(!dr)return;var l=$('lay');if(l)l.style.transform='translate('+(e.clientX-dr.x)+'px,'+(e.clientY-dr.y)+'px)'});
addEventListener('pointerup',function(e){if(!dr)return;var dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr=null;if(Math.hypot(dx,dy)<6)return;var c=mp(fb.C[0],fb.C[1],fb.Z);fb.C=un(c[0]-dx,c[1]-dy,fb.Z);fbDraw()});
addEventListener('resize',function(){if(tab=='mapa'&&!page&&!MAP)fbDraw()});

function vPanel(){const evs=S.all.filter(canMod).sort((a,b)=>a.dt.localeCompare(b.dt));
let h=`<div class="pg"><h2 style="margin:0 0 10px">${role=='admin'?'🛠️ Panel de administración':'🏢 Panel de '+esc(orgName)}</h2><button class="btn ghost" style="margin:0 0 12px" data-a="sout">Cerrar sesión del equipo</button>`+evForm();
h+=`<h3 class="h">${role=='admin'?'Todas las competiciones ('+evs.length+')':'Mis competiciones'}</h3>`+(evs.length?evs.map(evTools).join(''):empty('Sin competiciones','Publica la primera con el formulario.'));
if(role=='admin'){
h+=`<h3 class="h">Noticias del tablón</h3><details class="card"><summary><b>Publicar noticia</b></summary><form data-f="news"><label>Titular</label><input name="t" required><div class="row"><div><label>Sección</label><select name="c">${opt(NC)}</select></div><div><label>Autor</label><input name="a" required></div></div><label>Texto</label><textarea name="x" rows="4" required></textarea><button class="btn">Publicar</button></form></details>${S.news.map(n=>`<p>${esc(n.t)} <button class="x" data-a="delnews" data-v="${n.id}">Eliminar</button></p>`).join('')}`;
h+=`<h3 class="h">Avisos y promociones</h3><form class="card" data-f="bcast"><label>Título</label><input name="t" required><label>Mensaje</label><textarea name="x" rows="3" required></textarea><label>Tipo</label><select name="k"><option value="aviso">Aviso del servicio (a todos)</option><option value="promocion">Promoción (solo a quien lo ha aceptado)</option></select><button class="btn">Enviar a los deportistas</button><p class="m" style="font-size:12px;margin:8px 0 0">Aparece en la cuenta de cada deportista. El envío por correo se activa cuando se conecte un proveedor de correo.</p></form>`;
h+=`<h3 class="h">Suscripción</h3><form class="card" data-f="setp"><label>Precio mensual (€)</label><input name="pr" type="number" min="0" step="0.5" value="${esc(S.set.price)}" required><button class="btn ghost">Guardar precio</button></form>`;
h+=`<h3 class="h">Organizadores</h3><form class="card" data-f="org"><label>Nombre del organizador</label><input name="name" required><button class="btn">Crear código de acceso</button></form>`;
h+=`<h3 class="h">Importar competiciones (CSV)</h3><form class="card" data-f="imp"><p class="m" style="font-size:12px;margin:0">Una por línea: nombre;deporte;provincia;localidad;fecha(AAAA-MM-DD);distancias;precio;licencia;calendario;web;lat;lon</p><textarea name="csv" rows="5" required></textarea><button class="btn">Importar</button></form>`;

function banner(){var b=$('bn');if(!loaded&&!loadErr){b.className='bn';b.textContent='Cargando competiciones…'}else if(loadErr){b.className='bn';b.innerHTML='No se pudo conectar con el servidor. <button data-a="retry">Reintentar</button>'}else{b.className='';b.innerHTML=''}}

$('th').textContent=document.documentElement.dataset.theme=='light'?'🌙':'☀';
$('nav').innerHTML=[['mapa','🗺️','Mapa'],['eventos','📅','Pruebas'],['cal','🗓️','Calendario'],['noticias','📰','Noticias'],['acc','👤',user?'Cuenta':'Entrar']].map(function(t){return '<button class="'+(tab==t[0]&&!page?'on':'')+'" data-a="tab" data-v="'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');

if(keep)initMap();if(page&&page.k=='ev')startCd()}
async function openEv(id){if(!S.ev.concat(S.all).some(function(x){return x.id==id})){try{S.all.push((await api('/events/'+encodeURIComponent(id))).event)}catch(e){toast('No se encontró la prueba');return}}page={k:'ev',id:id};tab=tab=='mapa'||tab=='eventos'||tab=='cal'?tab:'eventos'}
async function participo(id){if(!user){pending=id;authMode='in';page={k:'auth'};return}
if(!subOn()){pending=id;page={k:'sub'};return}
try{await api('/calendar',{method:'POST',body:{eid:id}})}catch(e){if(e.status==402){pending=id;page={k:'sub'};return}throw e}
await loadMe();pending=null;toast('¡Añadida a tu calendario deportivo!')}

function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('vtheme',t)}catch(e){}}
/* ---- clics ---- */
document.addEventListener('click',async function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
if(b.tagName=='A'&&b.getAttribute('href')=='#')ev.preventDefault();
try{

else if(a=='reg'){region=v;loaded=false;render();await loadEv();loaded=true}
else if(a=='part'){await participo(v)}
else if(a=='authgo'){authMode=authMode||'in';page={k:'auth'}}

else if(a=='subinfo'){page={k:'sub'}}

else if(a=='cday'){calDay=calDay==v?'':v}
else if(a=='calnav'){calM=new Date(calM.getFullYear(),calM.getMonth()+ +v,1);calDay=''}
else if(a=='ics1'){var x=S.cal.concat(S.ev,S.all).find(function(z){return eidOf(z)==v});if(x)dl('vybra-'+v+'.ics','text/calendar',icsText([x]));return}

else if(a=='logout'){if(sbc)await sbc.auth.signOut();user=null;await loadMe();page=null;toast('Has cerrado sesión')}
else if(a=='forgot'){var em=prompt('Escribe tu correo y te enviaremos un enlace para cambiar la contraseña');if(!em)return;var r=await sbc.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.origin});if(r.error)throw r.error;toast('Si el correo existe, recibirás un enlace');return}
else if(a=='readn'){await api('/notifications/read',{method:'POST'});await loadMe()}
else if(a=='legal'){page={k:'legal'}}
else if(a=='drawer'){drawer=true}else if(a=='dclose'){drawer=false}
else if(a=='reply'){replyTo=v}else if(a=='noreply'){replyTo=null}
else if(a=='delpost'){if(!confirm('¿Eliminar el mensaje?'))return;await act('del_post',{id:v});await load()}

else if(a=='retry'){loaded=false;loadErr=false;render();await load()}
render()}catch(x){toast(x.message||'Algo ha fallado');render()}});

else if(k=='edit'){var p={nm:d.nm,dt:d.dt,hora:d.hora||'',cierre:d.cierre||'',loc:d.loc,dist:d.dist,url:d.url,fed:d.fed,ofi:d.ofi,ds:d.ds};if(d.org!==undefined)p.org=d.org;await api('/events/'+encodeURIComponent(f.dataset.id),{method:'PATCH',staff:true,body:p});await loadEv();await loadStaff();toast('Cambios guardados')}

if(canMod(e0))await act('post',{eid:e0.id,c:d.c,x:d.x.trim(),re:replyTo||''});else{var pr=await sbc.from('posts').insert({eid:e0.id,c:d.c,x:d.x.trim(),a:'x',re:replyTo||null});if(pr.error)throw Error(pr.error.message)}
replyTo=null;await load();toast('Mensaje publicado')}
else if(k=='news'){await act('add_news',{c:d.c,t:d.t.trim(),a:d.a.trim(),x:d.x.trim()});await load();toast('Noticia publicada')}
else if(k=='bcast'){var n=await rpc('admin_broadcast',{p_code:CODE,p_title:d.t.trim(),p_body:d.x.trim(),p_kind:d.k});toast('Enviado a '+n+' deportistas')}
else if(k=='setp'){await rpc('admin_set_setting',{p_code:CODE,p_key:'subscription',p_value:{price:+d.pr,currency:'EUR',period:S.set.period,demo:S.set.demo}});await loadSet();toast('Precio actualizado')}
else if(k=='org'){var o=await act('add_org',{name:d.name.trim()});alert('Código de acceso de '+d.name.trim()+': '+o.code+'\nGuárdalo y pásaselo al organizador: no se vuelve a mostrar.')}
else if(k=='imp'){var rows=d.csv.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){return l.split(l.indexOf('\t')>=0?'\t':';').map(function(x){return x.trim()})}).filter(function(c){return c[0].toLowerCase()!='nombre'});
var R=rows.map(function(c){return{nm:c[0],sp:SP[c[1]]?c[1]:'Otros',pv:c[2],loc:c[3],dt:c[4],dist:c[5],pr:c[6],fed:c[7],ofi:c[8],url:c[9],lat:parseFloat((c[10]||'').replace(',','.')),lon:parseFloat((c[11]||'').replace(',','.'))}}).filter(function(x){return x.nm&&x.dt&&PV[x.pv]&&isFinite(x.lat)&&isFinite(x.lon)});
if(!R.length)throw Error('No se pudo leer ninguna fila válida (revisa provincia, fecha y coordenadas)');var ri=await act('import_events',{rows:R});await loadEv();await loadStaff();toast(ri.n+' competiciones importadas')}
else if(k=='svc'){var sv=SERV.find(function(z){return z.id==f.dataset.s});await rpc('request_service',{p_s:sv.n,p_c:d.c,p_em:d.em.trim()});toast('Solicitud enviada: te contactaremos')}
else if(k=='priv'){await rpc('privacy_request',{p_email:d.em.trim()});toast('Solicitud enviada')}
render()}catch(x){toast(x.message||'Algo ha fallado')}});

document.addEventListener('change',function(e){var k=e.target.dataset.fs;if(!k)return;var v=e.target.value;if(k=='sport')sport=v;else if(k=='dfil')dfil=v;else if(k=='ord')ord=v;
if(tab=='mapa'&&!page)refreshMap();else render()});
document.addEventListener('input',function(e){if(e.target.id!='q')return;q=e.target.value;if(tab=='mapa'&&!page)refreshMap();else if($('lst')){$('lst').innerHTML=listHtml();$('lcnt').textContent=sorted().length+' pruebas'}});
/* ---- arranque ---- */
function tick(){var n=new Date();$('clk').innerHTML=n.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+'<br><b>'+n.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</b>'}
tick();setInterval(tick,30000);
(async function(){render();await Promise.all([load(),loadSet()]);
if(sbc){try{var r=await sbc.auth.getSession();user=r.data.session?r.data.session.user:null}catch(e){}
sbc.auth.onAuthStateChange(async function(evn,ses){var u=ses?ses.user:null;if((u&&u.id)===(user&&user.id))return;user=u;await loadMe();render()})}
await loadMe();
if(CODE){try{var w=await rpc('act',{p_code:CODE,p_action:'whoami',p:{}});role=w.role;orgName=w.name;await loadStaff()}catch(e){CODE=''}}
var deep=new URLSearchParams(location.search).get('e');if(deep)await openEv(deep);
render();
var sig=function(){return S.ev.length+':'+S.news.length+':'+S.live.length+':'+S.posts.length};
setInterval(async function(){if(document.hidden||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;var s0=sig(),h0=loaded;await load();if(s0!==sig()||h0!==loaded)render()},30000)})();

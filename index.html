const legalFoot=()=>'<p class="m" style="font-size:12px;margin-top:18px"><span class="lk" data-a="legal">Privacidad y aviso legal</span></p>';
/* ---- vistas: mapa, eventos ---- */
const regChips=()=>['Andalucía','España'].map(r=>`<button class="chip ${region==r?'on':''}" data-a="reg" data-v="${r}">${r=='España'?'Toda España':r}</button>`).join('');
const regSeg=()=>['Andalucía','España'].map(r=>`<button class="${region==r?'on':''}" data-a="reg" data-v="${r}">${r=='España'?'Toda España':'Andalucía'}</button>`).join('');
function vMapa(){return `<div id="map"></div><div class="mt"><div class="mf" id="rg">${regChips()}</div><div class="mf"><input id="q" placeholder="Buscar prueba o municipio" value="${esc(q)}" aria-label="Buscar">${fsel('sport',SPP,sport)}${fsel('dfil',DFP,dfil)}</div></div><aside class="nt"><div class="nth">Tablón de noticias</div><div class="ntb">${tk()}</div></aside><div class="mcnt" id="mcnt"></div>`}
const cardH=e=>`<article class="card ev" data-a="ev" data-v="${e.id}">${imgOk(e.img)?`<img class="thumb" src="${esc(e.img)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="sb">${ic(SP[e.sp]||'otr',22)}</span>`}<div style="flex:1;min-width:0"><h3>${esc(e.nm)}</h3><p>${fd(e.dt)}${e.hora?' · '+esc(e.hora):''} · ${esc(e.loc?e.loc+', ':'')}${esc(e.pv)}</p><p class="m" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px">${cdLive(e)}<span class="tag g">${esc(e.fed)}</span><span class="tag g">${esc(e.ofi||'Por confirmar')}</span>${inCal(e)?'<span class="tag" style="background:#1f9d55">Participas</span>':''}${e.dist?'<span>'+esc(e.dist)+'</span>':''}</p></div></article>`;
function listHtml(){if(!loaded&&!loadErr)return '<div class="sk"></div>'.repeat(5);const l=sorted();if(!l.length)return empty('No hay competiciones con estos filtros','Prueba a quitar algún filtro o a cambiar a «Toda España».');if(ord!='fecha')return l.map(cardH).join('');let m='',h='';l.forEach(e=>{const k=e.dt.slice(0,7);if(k!=m){m=k;h+='<div class="mh">'+new Date(e.dt+'T00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})+'</div>'}h+=cardH(e)});return h}
const monthChips=()=>{const n=new Date(),o=[];for(let i=0;i<9;i++){const d=new Date(n.getFullYear(),n.getMonth()+i,1),y=d.getFullYear(),mo=p2(d.getMonth()+1),last=new Date(y,d.getMonth()+1,0).getDate(),a=y+'-'+mo+'-01',b=y+'-'+mo+'-'+p2(last);o.push(`<button class="chip ${dfrom==a&&dto==b?'on':''}" data-a="month" data-v="${a}|${b}">${d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')}${i==0||d.getMonth()==0?' '+String(y).slice(2):''}</button>`)}return '<div class="mrow">'+o.join('')+'</div>'};
const dateUI=()=>`${monthChips()}<div class="dt2"><span>Fechas</span><input type="date" data-fd="from" value="${esc(dfrom)}" aria-label="Desde"><span>a</span><input type="date" data-fd="to" value="${esc(dto)}" aria-label="Hasta">${dfrom||dto?'<button class="x" data-a="cleard">Quitar fechas</button>':''}</div>`;
function vEv(){return `<div class="pg"><div class="seg" id="rg2">${regSeg()}</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px"><input id="q" placeholder="Buscar prueba o municipio" value="${esc(q)}" aria-label="Buscar">${fsel('sport',SPP,sport)}${fsel('dfil',DFP,dfil)}${fsel('ord',ORP,ord)}</div><div id="df">${dateUI()}</div><p class="m" style="margin:0 0 10px;font-size:13px" id="lcnt">${sorted().length} pruebas</p><div id="lst">${listHtml()}</div>${legalFoot()}</div>`}

/* ---- ficha de la prueba ---- */
const calBtns=x=>`<div class="row"><a class="btn ghost" href="${esc(gcal(x))}" target="_blank" rel="noopener">${ic('calplus',18)} Google Calendar</a><button class="btn ghost" data-a="ics1" data-v="${esc(eidOf(x))}">${ic('calplus',18)} Apple Calendar (.ics)</button></div>`;
const liveBox=e=>{const l=S.live.filter(x=>x.eid==e.id).sort((a,b)=>b.ts-a.ts);return (l.length?'<h3 class="h"><span class="dot"></span>En directo</h3>'+l.map(x=>`<div class="post"><small>${new Date(x.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</small> ${esc(x.x)}</div>`).join(''):'')+(canMod(e)?`<form class="card" data-f="live" data-id="${e.id}"><label>Publicar actualización en directo</label><textarea name="x" rows="2" required></textarea><button class="btn">Publicar en directo</button></form>`:'')};
const rpl=()=>{const p=replyTo&&S.posts.find(z=>z.id==replyTo);return p?`<p class="rp">Respondiendo a <b>${esc(p.a)}</b> <button type="button" class="x" data-a="noreply">Cancelar</button></p>`:''};
function postHtml(p,e){const par=p.re&&S.posts.find(z=>z.id==p.re);return `<div class="post"><b>${esc(p.a)}</b> ${p.st?'<span class="tag" style="background:#fff;color:#000">Organización</span> ':''}<span class="tag g">${esc(p.c)}</span> <small>${new Date(p.ts).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small>${par?`<div class="rp"><b>${esc(par.a)}</b>: ${esc(par.x.slice(0,90))}</div>`:'<br>'}${esc(p.x)}<br><button class="x" data-a="reply" data-v="${p.id}">Responder</button>${canMod(e)?` <button class="x" data-a="delpost" data-v="${p.id}">Eliminar</button>`:''}</div>`}
function forumHtml(e){const ps=S.posts.filter(p=>p.eid==e.id).sort((a,b)=>b.ts-a.ts),can=canMod(e)||(user&&inCal(e));
return '<h3 class="h">Foro de la prueba</h3>'+(can?`<form class="card" data-f="post" data-id="${e.id}">${rpl()}<select name="c">${opt(FC)}</select><textarea name="x" rows="3" required placeholder="Escribe a los participantes…" style="margin-top:8px"></textarea><button class="btn">Publicar mensaje</button></form>`:'<p class="m" style="font-size:13px">Pulsa «Participo» para poder escribir en el foro.</p>')+(ps.length?ps.map(p=>postHtml(p,e)).join(''):empty('Aún no hay mensajes','Escribe el primero.'))}
function fichaActions(e){const url=/^https?:\/\//.test(e.url||'')?e.url:'',part=inCal(e);let h=url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Ir a la web oficial para inscribirme</a>`:'';
h+=part?`<div class="card ok" style="margin-top:12px"><b>${ic('check',17)} Participas en esta prueba</b><p class="m" style="margin:2px 0 0;font-size:13px">Ya está en tu calendario deportivo.</p></div>${calBtns(e)}<button class="btn ghost" data-a="tab" data-v="cal">Ver mi calendario</button>`:`<button class="btn alt" data-a="part" data-v="${e.id}">Participo</button><p class="m" style="font-size:13px;margin:6px 0 0">Te inscribes en la web oficial y, al volver, pulsas «Participo» para añadir la prueba a tu calendario deportivo.</p>`;return h}
const fichaForum=e=>liveBox(e)+forumHtml(e);
const curEv=()=>page&&page.k=='ev'?S.ev.concat(S.all).find(x=>x.id==page.id):null;
function vEvPage(){const e=curEv();if(!e){page=null;return vEv()}
const n=dLeft(e);
let h=`<div class="back" data-a="back">← Volver</div><div class="sh${imgOk(e.img)?' img':''}" ${imgOk(e.img)?`style="background-image:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.78)),url('${esc(e.img)}')"`:''}><span class="tag" style="background:#000">${ic(SP[e.sp]||'otr',14)} ${esc(e.sp)} · ${esc(e.fed)} · ${esc(e.ofi||'Por confirmar')}</span><h2>${esc(e.nm)}</h2><p>${fd(e.dt)}${e.hora?' · '+esc(e.hora):''}</p></div><div class="pg">`;
h+=`<p style="margin:0;display:grid;gap:4px"><span>${ic('pin',17)} ${esc(e.loc?e.loc+', ':'')}${esc(e.pv)}${e.region?' ('+esc(e.region)+')':''}</span><span>${ic('org',17)} Organiza ${esc(e.org)}</span></p>`;
h+=n===null?'<p class="m">Sin fecha de cierre de inscripción indicada.</p>':`<h3 class="h">Cierre de la inscripción · ${fs_(e.cierre)}</h3><div id="cdbox" data-end="${new Date(e.cierre+'T23:59:59').getTime()}"></div>`;
h+=`<div id="fa">${fichaActions(e)}</div>`;
h+=`<a class="btn ghost" href="${esc(gmu(e))}" target="_blank" rel="noopener">${ic('pin',18)} Cómo llegar (Google Maps)</a><span class="m" style="font-size:12px">${e.ex?'Ubicación exacta confirmada':'Ubicación aproximada (localidad)'}</span>`;
if(e.ds)h+=`<p class="m" style="white-space:pre-wrap">${esc(e.ds)}</p>`;
if(e.dist)h+=`<h3 class="h">Distancias</h3><p style="margin:0">${esc(e.dist)}</p>`;
h+=`<div id="ff">${fichaForum(e)}</div>`;
if(e.checked)h+=`<p class="m" style="font-size:12px;margin-top:16px">Datos comprobados el ${fs_(e.checked)}</p>`;
return h+'</div>'}

/* ---- noticias y legal ---- */
function vNews(){return `<div class="pg"><h2 style="margin:0 0 10px">Tablón de noticias</h2>${S.news.length?[...S.news].sort((a,b)=>b.ts-a.ts).map(n=>`<article class="card nw"><span class="tag">${esc(n.c)}</span><h3 style="margin:6px 0">${esc(n.t)}</h3><p style="white-space:pre-wrap;margin:0">${esc(n.x)}</p><p class="m" style="font-size:12px">${esc(n.a)} · ${new Date(n.ts).toLocaleDateString('es-ES')}</p></article>`).join(''):empty('Sin noticias todavía','El equipo de Vybra las publicará aquí.')}${legalFoot()}</div>`}
function vLegal(){return `<div class="back" data-a="back">← Volver</div><div class="pg"><h2>Privacidad y aviso legal</h2>
<h3 class="h">Política de privacidad</h3><p><b>Responsable:</b> ${esc(LEG.titular)} (contacto: ${esc(LEG.email)}).</p><p><b>Datos que tratamos:</b> correo electrónico, nombre, las pruebas que añades a tu calendario, tu suscripción y, si lo aceptas, el envío de avisos y promociones.</p><p><b>Para qué:</b> darte tu cuenta y tu calendario deportivo, enviarte los avisos del servicio y, solo si marcas la casilla, promociones. <b>Base legal:</b> tu consentimiento y la ejecución del servicio que pides.</p><p><b>Quién los ve:</b> solo tú y el equipo de Vybra. Usamos proveedores de alojamiento y de autenticación para prestar el servicio. No vendemos tus datos.</p><p><b>Cuánto tiempo:</b> mientras tengas la cuenta. Puedes pedir que se borre.</p><p><b>Tus derechos:</b> acceso, rectificación, supresión, oposición y portabilidad, escribiendo al contacto de arriba o con el formulario de esta página. <b>Almacenamiento local:</b> la web guarda en tu dispositivo el modo claro u oscuro y la sesión; no usa cookies de seguimiento.</p>
<h3 class="h">Aviso legal</h3><p>Vybra es un servicio en desarrollo. La información de las competiciones procede de calendarios públicos y puede contener errores: confirma siempre fecha, lugar y condiciones en la web oficial de cada prueba. Vybra no organiza las pruebas listadas ni gestiona sus inscripciones.</p>
<h3 class="h">Suscripción</h3><p>La suscripción da acceso al calendario deportivo personal. Mientras el cobro esté en modo demostración no se realiza ningún cargo.</p>
<form class="card" data-f="priv"><h3 style="margin:0">Solicitar el borrado de mis datos</h3><label>Tu correo</label><input name="em" type="email" required value="${esc(S.me?S.me.email:'')}"><button class="btn">Enviar solicitud</button></form></div>`}
/* ---- cuenta: entrar, crear cuenta, perfil ---- */
const authForm=()=>authMode=='in'?`<form class="card" data-f="login"><h3 style="margin:0">Entrar</h3><label>Correo</label><input name="em" type="email" required autocomplete="email"><label>Contraseña</label><input name="pw" type="password" required autocomplete="current-password"><button class="btn">Entrar</button><p class="m" style="font-size:13px;margin:10px 0 0"><span class="lk" data-a="forgot">¿Has olvidado la contraseña?</span> · <span class="lk" data-a="am" data-v="up">Crear una cuenta</span></p></form>`:`<form class="card" data-f="signup"><h3 style="margin:0">Crear cuenta de deportista</h3><label>Nombre</label><input name="nm" required autocomplete="name"><label>Correo</label><input name="em" type="email" required autocomplete="email"><label>Contraseña (mínimo 8 caracteres)</label><input name="pw" type="password" minlength="8" required autocomplete="new-password"><label class="ck"><input type="checkbox" name="ok" required><span>He leído la <span class="lk" data-a="legal">política de privacidad</span> y acepto el tratamiento de mis datos.</span></label><label class="ck"><input type="checkbox" name="mk"><span>Quiero recibir avisos y promociones por correo (opcional).</span></label><button class="btn">Crear cuenta</button><p class="m" style="font-size:13px;margin:10px 0 0">¿Ya tienes cuenta? <span class="lk" data-a="am" data-v="in">Entrar</span></p></form>`;
const vAuthPage=()=>`<div class="back" data-a="back">← Volver</div><div class="pg"><h2 style="margin:0 0 6px">${authMode=='in'?'Entra en tu cuenta':'Crea tu cuenta'}</h2>${pending?'<p class="m">Para añadir la prueba a tu calendario deportivo necesitas una cuenta.</p>':''}<div id="af">${authForm()}</div>${legalFoot()}</div>`;
const profileHtml=()=>{const un=S.notes.filter(n=>!n.read).length;return `<h2 style="margin:0 0 10px">Hola, ${esc(S.me?S.me.name:'deportista')}</h2><div class="card"><b>${esc(S.me?S.me.email:user.email)}</b><form data-f="prof"><label>Nombre</label><input name="nm" value="${esc(S.me?S.me.name:'')}" required><label class="ck"><input type="checkbox" name="mk" ${S.me&&S.me.marketing?'checked':''}><span>Recibir avisos y promociones por correo</span></label><button class="btn ghost">Guardar</button></form></div><div class="card"><h3 style="margin:0 0 6px">Suscripción</h3>${subOn()?`<p style="margin:0"><span class="tag" style="background:#22c55e">Activa</span> hasta ${fs_(String(S.sub.ends).slice(0,10))}</p>`:'<p class="m" style="margin:0">No tienes una suscripción activa.</p>'}<button class="btn ${subOn()?'ghost':''}" data-a="subinfo">${subOn()?'Ver detalles':'Suscribirme · '+S.set.price+' €/'+esc(S.set.period)}</button></div><h3 class="h">Avisos ${un?'('+un+' nuevos)':''}</h3>${S.notes.length?S.notes.slice(0,10).map(n=>`<div class="card" style="${n.read?'opacity:.7':''}"><b>${esc(n.title)}</b><p style="margin:2px 0 0;white-space:pre-wrap">${esc(n.body)}</p><small class="m">${fs_(String(n.created).slice(0,10))}</small></div>`).join('')+(un?'<button class="btn ghost" data-a="readn">Marcar como leídos</button>':''):'<p class="m">No tienes avisos.</p>'}<button class="btn ghost" data-a="logout">Cerrar sesión</button>`};
const staffBox=()=>`<details class="card" style="margin-top:18px"><summary class="m">Acceso del equipo</summary><form data-f="staff"><label>Código de acceso</label><input name="pin" type="password" required><button class="btn ghost">Entrar</button></form></details>`;
function vAcc(){if(role)return vPanel();return '<div class="pg">'+(!user?`<h2 style="margin:0 0 10px">Tu cuenta</h2><p class="m">Crea tu cuenta de deportista para tener tu calendario deportivo y recibir avisos.</p><div id="af">${authForm()}</div>`:profileHtml())+staffBox()+legalFoot()+'</div>'}
/* ---- suscripción ---- */
const subLink=()=>{const l=S.set.link;if(!l)return '';try{const u=new URL(l);if(user){u.searchParams.set('prefilled_email',user.email||'');u.searchParams.set('client_reference_id',user.id)}return u.toString()}catch(e){return ''}};
function vSub(){const st=S.set,pr=(+st.price).toLocaleString('es-ES',{maximumFractionDigits:2}),link=subLink();
return `<div class="back" data-a="back">← Volver</div><div class="sh"><h2>Calendario deportivo</h2><p>Suscripción de deportista</p></div><div class="pg"><p class="sub-price">${pr} €<span class="m" style="font-size:16px;font-weight:400"> / ${esc(st.period)}</span></p><ul style="line-height:1.7"><li>Tu calendario deportivo personal con las pruebas en las que participas</li><li>Guarda cada prueba en Apple Calendar o Google Calendar, o sincroniza todo</li><li>Cuenta atrás y avisos del cierre de inscripción</li><li>Foro de cada prueba</li></ul>${st.demo&&!st.link?'<p class="m" style="font-size:13px">Modo demostración: por ahora no se realiza ningún cobro, y el precio puede cambiar.</p>':''}${!user?'<button class="btn" data-a="authgo">Crear cuenta o entrar</button>':subOn()?`<div class="card ok"><b>Suscripción activa</b><p style="margin:2px 0 0">Hasta ${fs_(String(S.sub.ends).slice(0,10))}</p></div>${st.link?(st.portal?`<a class="btn ghost" href="${esc(st.portal)}" target="_blank" rel="noopener">Gestionar o cancelar mi suscripción</a>`:'<p class="m" style="font-size:13px">Para cancelar la suscripción, escríbenos desde el correo de tu cuenta.</p>'):'<button class="btn ghost" data-a="subcancel">Cancelar suscripción</button>'}`:link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Suscribirme por ${pr} €/${esc(st.period)}</a><p class="m" style="font-size:13px;margin:6px 0 0">Pagas de forma segura en Stripe y vuelves aquí. La suscripción se activa en unos segundos.</p><button class="btn ghost" data-a="subcheck">Ya he pagado: comprobar</button>`:`<button class="btn" data-a="subgo">Suscribirme por ${pr} €/${esc(st.period)}</button>`}${legalFoot()}</div>`}
/* ---- calendario deportivo ---- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const calItem=c=>{const d=new Date(c.dt+'T00:00');return `<div class="card" style="display:flex;gap:12px"><div class="dblk"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div><div style="flex:1;min-width:0"><b>${esc(c.nm)}</b><p class="m" style="margin:2px 0 6px;font-size:13px">${esc(c.hora?'Salida a las '+c.hora:'Hora por confirmar')} · ${esc(c.loc?c.loc+', ':'')}${esc(c.pv||'')}</p><p style="margin:0 0 4px">${cdLive(c)}</p>${calBtns(c)}<div class="row"><button class="btn ghost" data-a="ev" data-v="${esc(c.eid)}">Ver la prueba</button><button class="btn ghost" data-a="qcal" data-v="${esc(c.eid)}">Quitar</button></div></div></div>`};
const feedBox=()=>{const u=feedUrl();return `<h3 class="h">Sincronizar todo mi calendario</h3><div class="card"><p class="m" style="margin:0 0 6px;font-size:13px">Suscríbete una vez y tus pruebas aparecerán solas en tu calendario.</p><div class="row"><a class="btn ghost" href="${esc(u)}">${ic('calplus',18)} Apple Calendar</a><a class="btn ghost" href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(u)}" target="_blank" rel="noopener">${ic('calplus',18)} Google Calendar</a></div><button class="btn ghost" data-a="icsall">Descargar todo (.ics)</button></div>`};
function calGrid(){const y=calM.getFullYear(),m=calM.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),by={},dls={};
S.cal.forEach(c=>{(by[c.dt]=by[c.dt]||[]).push(c);if(c.cierre&&dLeft(c)>=0)(dls[c.cierre]=dls[c.cierre]||[]).push(c)});
let g='';for(let i=0;i<off;i++)g+='<div class="cgd off"></div>';
for(let d=1;d<=dim;d++){const k=y+'-'+p2(m+1)+'-'+p2(d),its=by[k]||[],dl=dls[k]||[];
const ch=its.slice(0,2).map(c=>`<span class="cch" data-a="csel" data-v="${esc(c.eid)}" title="${esc(c.nm)}">${c.hora?'<b>'+esc(c.hora)+'</b> ':''}${esc(c.nm)}</span>`).join('')+(its.length>2?`<span class="cmore">+${its.length-2} más</span>`:'')+(dl.length?`<span class="cch dl" title="Cierra la inscripción: ${esc(dl[0].nm)}">${ic('clock',10)} cierre</span>`:'');
g+=`<div class="cgd ${its.length||dl.length?'has':''} ${k==today()?'today':''} ${calDay==k?'sel':''}" data-a="cday" data-v="${k}"><span class="dn">${d}</span>${ch}</div>`}
return g}
function calWidget(){const sel=calSel?S.cal.filter(c=>c.eid==calSel):(calDay?S.cal.filter(c=>c.dt==calDay):[]);
return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="ib" data-a="calnav" data-v="-1" aria-label="Mes anterior">‹</button><b class="cmt">${calM.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button class="ib" data-a="calnav" data-v="1" aria-label="Mes siguiente">›</button></div><div class="cgh"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="cg">${calGrid()}</div>${calDay||calSel?`<p class="m" style="margin:10px 0 6px"><span class="lk" data-a="cday" data-v="">Quitar selección</span> · ${calSel?'Prueba seleccionada':fs_(calDay)}</p>${sel.length?sel.map(calItem).join(''):'<p class="m">No tienes pruebas ese día.</p>'}`:''}`}
const calAgenda=()=>{const items=[...S.cal].sort((a,b)=>a.dt.localeCompare(b.dt));return '<h3 class="h">Mis próximas pruebas</h3>'+(items.length?items.map(calItem).join(''):empty('Todavía no tienes pruebas','Abre una prueba y pulsa «Participo».'))};

async function participo(id){if(!user){pending=id;authMode='in';page={k:'auth'};return 'nav'}

/* ---- clics ---- */
async function doAct(a,v,b){
if(a=='z'){fb.Z=Math.max(4,Math.min(17,fb.Z+ +v));fbDraw();return}
if(a=='theme'){setTheme(document.documentElement.dataset.theme=='light'?'dark':'light');renderHead();if(tab=='mapa'&&!page)initMap();return}
if(a=='tab'){tab=v;page=null;drawer=false;render();return}
if(a=='month'){var mm2=v.split('|');if(dfrom==mm2[0]&&dto==mm2[1]){dfrom='';dto=''}else{dfrom=mm2[0];dto=mm2[1]}updFilters();return}
if(a=='cleard'){dfrom='';dto='';updFilters();return}
if(a=='ev'){if(await openEv(v))render();return}
if(a=='back'){page=null;render();return}
if(a=='reg'){if(region==v)return;region=v;updRegion();if($('lst'))put('lst','<div class="sk"></div>'.repeat(4));await loadEv();if(tab=='mapa'&&!page){refreshMap();recenter()}else updList();return}
if(a=='part'){var r=await participo(v);if(r=='nav')render();else updFicha();return}
if(a=='authgo'){page={k:'auth'};render();return}
if(a=='am'){authMode=v;if(!put('af',authForm(),true))render();return}
if(a=='subinfo'){page={k:'sub'};render();return}
if(a=='subgo'){await api('/subscription',{method:'POST'});await loadMe();toast('Suscripción activada');if(pending){var id=pending;pending=null;await participo(id);page={k:'ev',id:id}}else page=null;render();return}
if(a=='subcheck'){await loadMe();if(subOn()){toast('Suscripción activa');if(pending){var id2=pending;pending=null;await participo(id2);page={k:'ev',id:id2}}render()}else toast('Todavía no consta el pago: puede tardar unos segundos');return}
if(a=='subcancel'){if(!confirm('¿Cancelar la suscripción?'))return;await api('/subscription',{method:'DELETE'});await loadMe();toast('Suscripción cancelada');render();return}
if(a=='qcal'){await api('/calendar/'+encodeURIComponent(v),{method:'DELETE'});await loadMe();calSel='';updCal();toast('Quitada de tu calendario');return}
if(a=='cday'){calDay=calDay==v?'':v;calSel='';updCal();return}
if(a=='csel'){var it=S.cal.find(function(z){return z.eid==v});if(!it)return;if(calSel==v){calSel='';calDay=''}else{calSel=v;calDay=it.dt;var d=new Date(it.dt+'T00:00');calM=new Date(d.getFullYear(),d.getMonth(),1)}updCal();return}
if(a=='calnav'){calM=new Date(calM.getFullYear(),calM.getMonth()+ +v,1);calDay='';calSel='';updCal();return}
if(a=='ics1'){var x=S.cal.concat(S.ev,S.all).find(function(z){return eidOf(z)==v});if(x)dl('vybra-'+v+'.ics','text/calendar',icsText([x]));return}
if(a=='icsall'){dl('mi-calendario-vybra.ics','text/calendar',icsText(S.cal));return}
if(a=='logout'){if(sbc)await sbc.auth.signOut();user=null;await loadMe();page=null;toast('Has cerrado sesión');render();return}
if(a=='forgot'){var em=prompt('Escribe tu correo y te enviaremos un enlace para cambiar la contraseña');if(!em)return;var r2=await sbc.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.origin});if(r2.error)throw r2.error;toast('Si el correo existe, recibirás un enlace');return}
if(a=='readn'){await api('/notifications/read',{method:'POST'});await loadMe();render();return}
if(a=='legal'){page={k:'legal'};render();return}
if(a=='drawer'){drawer=true;$('modal').innerHTML=vDrawer();return}
if(a=='dclose'){drawer=false;$('modal').innerHTML='';return}
if(a=='reply'){replyTo=v;updFicha();var ta=document.querySelector('#ff textarea');if(ta)ta.focus();return}
if(a=='noreply'){replyTo=null;updFicha();return}
if(a=='delpost'){if(!confirm('¿Eliminar el mensaje?'))return;await act('del_post',{id:v});await load();updFicha();return}
if(a=='deleve'){if(!confirm('¿Eliminar esta competición?'))return;await api('/events/'+encodeURIComponent(v),{method:'DELETE',staff:true});await loadEv();await loadStaff();toast('Competición eliminada');render();return}
if(a=='delnews'){if(!confirm('¿Eliminar la noticia?'))return;await act('del_news',{id:v});await load();render();return}
if(a=='sout'){role='';orgName='';CODE='';S.all=[];S.svcs=[];try{sessionStorage.removeItem('vy')}catch(e){}render();return}
if(a=='retry'){loadErr=false;banner();await load();render();return}
}

else if(k=='bcast'){var n=await rpc('admin_broadcast',{p_code:CODE,p_title:d.t.trim(),p_body:d.x.trim(),p_kind:d.k});toast('Enviado a '+n+' deportistas');full=false;f.reset()}

else if(k=='act'){var msg=await rpc('admin_activate',{p_code:CODE,p_email:d.em.trim(),p_days:+d.days});toast(msg);full=false}
else if(k=='org'){var o=await act('add_org',{name:d.name.trim()});alert('Código de acceso de '+d.name.trim()+': '+o.code+'\nGuárdalo y pásaselo al organizador: no se vuelve a mostrar.');full=false;f.reset()}
else if(k=='imp'){var rows=d.csv.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){return l.split(l.indexOf('\t')>=0?'\t':';').map(function(x){return x.trim()})}).filter(function(c){return c[0].toLowerCase()!='nombre'});
var R=rows.map(function(c){return{nm:c[0],sp:SP[c[1]]?c[1]:'Otros',pv:c[2],loc:c[3],dt:c[4],hora:c[5],cierre:c[6],dist:c[7],fed:c[8],ofi:c[9],url:c[10],lat:parseFloat((c[11]||'').replace(',','.')),lon:parseFloat((c[12]||'').replace(',','.')),org:c[13]}}).filter(function(x){return x.nm&&x.dt&&PV[x.pv]&&isFinite(x.lat)&&isFinite(x.lon)});
if(!R.length)throw Error('No se pudo leer ninguna fila válida (revisa provincia, fecha y coordenadas)');var ri=await api('/events/bulk',{method:'POST',staff:true,body:{rows:R}});await loadEv();await loadStaff();toast(ri.added+' añadidas · '+ri.skipped+' ya existían · '+ri.invalid+' no válidas')}
else if(k=='svc'){var sv=SERV.find(function(z){return z.id==f.dataset.s});await rpc('request_service',{p_s:sv.n,p_c:d.c,p_em:d.em.trim()});toast('Solicitud enviada: te contactaremos');full=false;f.reset()}
else if(k=='priv'){await rpc('privacy_request',{p_email:d.em.trim()});toast('Solicitud enviada');full=false}
if(full)render()}catch(x){toast(x.message||'Algo ha fallado')}finally{if(btn)btn.classList.remove('busy')}});

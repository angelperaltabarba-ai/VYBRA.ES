<h3 class="h">Contenidos</h3><p>El Titular ha obtenido la información, el contenido multimedia y los materiales incluidos en el Sitio Web de fuentes que considera fiables, pero, si bien ha tomado todas las medidas razonables para asegurar que la información contenida es correcta, el Titular no garantiza que sea exacta, completa o actualizada. El Titular declina expresamente cualquier responsabilidad por error u omisión en la información contenida en las páginas del Sitio Web. Vybra no organiza las pruebas listadas ni gestiona sus inscripciones: confirma siempre fecha, lugar y condiciones en la web oficial de cada prueba.</p><p>Queda prohibido transmitir o enviar a través del Sitio Web cualquier contenido ilegal o ilícito, virus informáticos, o mensajes que, en general, afecten o violen derechos del Titular o de terceros.</p><p>Los contenidos del Sitio Web tienen únicamente una finalidad informativa y en ninguna circunstancia deben usarse ni considerarse como oferta de venta, solicitud de una oferta de compra ni recomendación para realizar cualquier otra operación, salvo que así se indique expresamente.</p><p>El Titular se reserva el derecho a modificar, suspender, cancelar o restringir el contenido del Sitio Web, los vínculos o la información obtenida a través del Sitio Web, sin necesidad de previo aviso.</p><p>El Titular no es responsable de los daños y perjuicios que pudieran derivarse de la utilización de la información del Sitio Web.</p>`}
function legPriv(){return `<h2>Política de privacidad</h2>
<p>El Titular le informa sobre su Política de Privacidad respecto del tratamiento y protección de los datos de carácter personal de los usuarios que puedan ser recabados durante la navegación a través del Sitio Web: ${esc(LEG.url)}</p><p>En este sentido, el Titular garantiza el cumplimiento de la normativa vigente en materia de protección de datos personales, reflejada en la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y de Garantía de Derechos Digitales (LOPDGDD). Cumple también con el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo de 27 de abril de 2016 relativo a la protección de las personas físicas (RGPD).</p><p>El uso del Sitio Web implica la aceptación de esta Política de Privacidad, así como las condiciones incluidas en el ${lk('aviso','Aviso legal')}.</p>
<h3 class="h">Identidad del responsable</h3><ul><li><b>Responsable:</b> ${esc(LEG.titular)}.</li><li><b>Domicilio:</b> Américo Vespucio, 27 (España).</li><li><b>Sitio web:</b> ${esc(LEG.url)}</li></ul>
<h3 class="h">Principios aplicados en el tratamiento de datos</h3><p>En el tratamiento de sus datos personales, el Titular aplicará los siguientes principios que se ajustan a las exigencias del reglamento europeo de protección de datos (RGPD):</p><ul><li><b>Licitud, lealtad y transparencia:</b> el Titular siempre requerirá el consentimiento para el tratamiento de los datos personales, que puede ser para uno o varios fines específicos sobre los que informará al Usuario previamente con absoluta transparencia.</li><li><b>Minimización de datos:</b> el Titular solicitará solo los datos estrictamente necesarios para el fin o los fines que los solicita.</li><li><b>Limitación del plazo de conservación:</b> el Titular mantendrá los datos personales recabados durante el tiempo estrictamente necesario para el fin o los fines del tratamiento e informará al Usuario del plazo de conservación correspondiente según la finalidad. En el caso de suscripciones, revisará periódicamente las listas y eliminará aquellos registros inactivos durante un tiempo considerable.</li><li><b>Integridad y confidencialidad:</b> los datos personales recabados serán tratados de tal manera que su seguridad, confidencialidad e integridad esté garantizada. El Titular toma las precauciones necesarias para evitar el acceso no autorizado o uso indebido de los datos de sus usuarios por parte de terceros.</li></ul>
<h3 class="h">Obtención de datos personales</h3><p>Para navegar por el Sitio Web no es necesario que facilite ningún dato personal.</p>
<h3 class="h">Derechos</h3><p>El Titular le informa que sobre sus datos personales tiene derecho a:</p><ul><li>Solicitar el acceso a los datos almacenados.</li><li>Solicitar una rectificación o la supresión.</li><li>Solicitar la limitación de su tratamiento.</li><li>Oponerse al tratamiento.</li></ul><p>No puede ejercitar el derecho a la portabilidad de los datos.</p><p>El ejercicio de estos derechos es personal y por tanto debe ser ejercido directamente por el interesado, solicitándolo directamente al Titular, lo que significa que cualquier cliente, suscriptor o colaborador que haya facilitado sus datos en algún momento puede dirigirse al Titular y pedir información sobre los datos que tiene almacenados y cómo los ha obtenido, solicitar la rectificación de los mismos, oponerse al tratamiento, limitar su uso o solicitar la supresión de esos datos en los ficheros del Titular.</p><p>Para ejercitar sus derechos tiene que enviar su petición junto con una fotocopia del Documento Nacional de Identidad o equivalente a la dirección de correo postal Américo Vespucio, 27 (España), o por correo electrónico a ${esc(LEG.email)}.</p><p>El ejercicio de estos derechos no incluye ningún dato que el Titular esté obligado a conservar con fines administrativos, legales o de seguridad.</p><p>Tiene derecho a la tutela judicial efectiva y a presentar una reclamación ante la autoridad de control, en este caso, la Agencia Española de Protección de Datos, si considera que el tratamiento de datos personales que le conciernen infringe el Reglamento.</p>
<h3 class="h">Finalidad del tratamiento de datos personales</h3><p>Cuando usted se conecta al Sitio Web para mandar un correo al Titular o se suscribe a su boletín, está facilitando información de carácter personal de la que el responsable es el Titular. Esta información puede incluir datos de carácter personal como pueden ser su dirección IP, nombre y apellidos, dirección física, dirección de correo electrónico, número de teléfono y otra información. Al facilitar esta información, da su consentimiento para que su información sea recopilada, utilizada, gestionada y almacenada por Vybra solo como se describe en las páginas de ${lk('aviso','Aviso legal')} y ${lk('priv','Política de privacidad')}.</p><p>Existen otras finalidades por las que el Titular trata datos personales:</p><ul><li>Para garantizar el cumplimiento de las condiciones recogidas en la página de Aviso Legal y de la ley aplicable. Esto puede incluir el desarrollo de herramientas y algoritmos que ayuden al Sitio Web a garantizar la confidencialidad de los datos personales que recoge.</li><li>Para apoyar y mejorar los servicios que ofrece este Sitio Web.</li></ul>
<h3 class="h">Seguridad de los datos personales</h3><p>Para proteger sus datos personales, el Titular toma todas las precauciones razonables y sigue las mejores prácticas de la industria para evitar su pérdida, mal uso, acceso indebido, divulgación, alteración o destrucción de estos.</p><p>Sus datos podrán ser incorporados a un fichero de lista de correo, del cual el Titular es responsable de su gestión y tratamiento. La seguridad de sus datos está garantizada, ya que el Titular toma todas las medidas de seguridad necesarias y le garantiza que los datos personales solo se usarán para las finalidades dadas.</p><p>El Titular informa al Usuario de que sus datos personales no serán cedidos a terceras organizaciones, con la salvedad de que dicha cesión de datos esté amparada en una obligación legal o cuando la prestación de un servicio implique la necesidad de una relación contractual con un encargado de tratamiento. En este último caso, solo se llevará a cabo la cesión de datos al tercero cuando el Titular disponga del consentimiento expreso del Usuario.</p><p>Sin embargo, en algunos casos se pueden realizar colaboraciones con otros profesionales; en esos casos se requerirá consentimiento al Usuario informando sobre la identidad del colaborador y la finalidad de la colaboración. Siempre se realizará con los más estrictos estándares de seguridad.</p>
<h3 class="h">Contenido de otros sitios web</h3><p>Las páginas de este Sitio Web pueden incluir contenido incrustado (por ejemplo, vídeos, imágenes, artículos, etc.). El contenido incrustado de otras webs se comporta exactamente de la misma manera que si hubiera visitado la otra web.</p><p>Estos sitios web pueden recopilar datos sobre usted, utilizar cookies, incrustar un código de seguimiento adicional de terceros y supervisar su interacción usando este código.</p>
<h3 class="h">Legitimación para el tratamiento de datos</h3><p>La base legal para el tratamiento de sus datos es el consentimiento del interesado.</p>
<h3 class="h">Categorías de datos personales</h3><ul><li>Datos identificativos.</li><li>No se tratan categorías de datos especialmente protegidos.</li></ul>
<h3 class="h">Conservación de datos personales</h3><p>Los datos personales proporcionados al Titular se conservarán hasta que solicite su supresión.</p>
<h3 class="h">Navegación web</h3><p>Al navegar por el Sitio Web se pueden recoger datos no identificativos, que pueden incluir la dirección IP, geolocalización, un registro de cómo se utilizan los servicios y sitios, hábitos de navegación y otros datos que no pueden ser utilizados para identificarle.</p><p>El Titular utiliza la información para obtener datos estadísticos, analizar tendencias, administrar el sitio, estudiar patrones de navegación y para recopilar información demográfica.</p><p>El Titular no se hace responsable del tratamiento de los datos personales que realicen las páginas web a las que pueda acceder a través de los distintos enlaces que contiene el Sitio Web.</p>
<h3 class="h">Exactitud y veracidad de los datos personales</h3><p>Usted se compromete a que los datos facilitados al Titular sean correctos, completos, exactos y vigentes, así como a mantenerlos debidamente actualizados.</p><p>Como Usuario del Sitio Web es el único responsable de la veracidad y corrección de los datos remitidos al Sitio Web, exonerando al Titular de cualquier responsabilidad al respecto.</p>

<h3 class="h">Cambios en la Política de Privacidad</h3><p>El Titular se reserva el derecho a modificar la presente Política de Privacidad para adaptarla a novedades legislativas o jurisprudenciales, así como a prácticas de la industria. Estas políticas estarán vigentes hasta que sean modificadas por otras debidamente publicadas.</p>

function legCook(){return `<h2>Política de cookies</h2>
<p>El acceso a este Sitio Web (${esc(LEG.url)}) puede implicar la utilización de cookies. Las cookies son pequeñas cantidades de información que se almacenan en el navegador utilizado por cada Usuario, en los distintos dispositivos que pueda utilizar para navegar, para que el servidor recuerde cierta información que posteriormente y únicamente el servidor que la implementó leerá. Las cookies facilitan la navegación, la hacen más amigable y no dañan el dispositivo de navegación.</p><p>Las cookies son procedimientos automáticos de recogida de información relativa a las preferencias determinadas por el Usuario durante su visita al Sitio Web con el fin de reconocerlo como Usuario y personalizar su experiencia y el uso del Sitio Web, y pueden también, por ejemplo, ayudar a identificar y resolver errores.</p><p>La información recabada a través de las cookies puede incluir la fecha y hora de visitas al Sitio Web, las páginas visionadas, el tiempo que ha estado en el Sitio Web y los sitios visitados justo antes y después del mismo. Sin embargo, ninguna cookie permite que esta misma pueda contactarse con el número de teléfono del Usuario o con cualquier otro medio de contacto personal. Ninguna cookie puede extraer información del disco duro del Usuario o robar información personal. La única manera de que la información privada del Usuario forme parte del archivo cookie es que el usuario dé personalmente esa información al servidor.</p><p>Las cookies que permiten identificar a una persona se consideran datos personales. Por tanto, a las mismas les será de aplicación la ${lk('priv','Política de privacidad')}. En este sentido, para la utilización de estas será necesario el consentimiento del Usuario. Este consentimiento será comunicado, en base a una elección auténtica, ofrecido mediante una decisión afirmativa y positiva, antes del tratamiento inicial, removible y documentado.</p>
<h3 class="h">Cookies propias</h3><p>Son aquellas cookies que son enviadas al ordenador o dispositivo del Usuario y gestionadas exclusivamente por Vybra para el mejor funcionamiento del Sitio Web. La información que se recaba se emplea para mejorar la calidad del Sitio Web y su contenido y su experiencia como Usuario. Estas cookies permiten reconocer al Usuario como visitante recurrente del Sitio Web y adaptar el contenido para ofrecerle contenidos que se ajusten a sus preferencias.</p>
<h3 class="h">Cookies de terceros</h3><p>Son cookies utilizadas y gestionadas por entidades externas que proporcionan a Vybra servicios solicitados por este mismo para mejorar el Sitio Web y la experiencia del usuario al navegar en el Sitio Web. Los principales objetivos para los que se utilizan cookies de terceros son la obtención de estadísticas de accesos y analizar la información de la navegación, es decir, cómo interactúa el Usuario con el Sitio Web.</p><p>La información que se obtiene se refiere, por ejemplo, al número de páginas visitadas, el idioma, el lugar a la que la dirección IP desde el que accede el Usuario, el número de Usuarios que acceden, la frecuencia y reincidencia de las visitas, el tiempo de visita, el navegador que usan, el operador o tipo de dispositivo desde el que se realiza la visita. Esta información se utiliza para mejorar el Sitio Web y detectar nuevas necesidades para ofrecer a los Usuarios un contenido y/o servicio de óptima calidad. En todo caso, la información se recopila de forma anónima y se elaboran informes de tendencias del Sitio Web sin identificar a usuarios individuales.</p><p>Puede obtener más información sobre las cookies, la información sobre la privacidad, o consultar la descripción del tipo de cookies que se utiliza, sus principales características, periodo de expiración, etc. en el siguiente enlace: <a class="lk" href="https://policies.google.com/technologies/cookies?hl=es" target="_blank" rel="noopener">Google Analytics</a>.</p><p>La(s) entidad(es) encargada(s) del suministro de cookies podrá(n) ceder esta información a terceros, siempre y cuando lo exija la ley o sea un tercero el que procese esta información para dichas entidades.</p>
<h3 class="h">Cookies de redes sociales</h3><p>Vybra incorpora plugins de redes sociales, que permiten acceder a las mismas a partir del Sitio Web. Por esta razón, las cookies de redes sociales pueden almacenarse en el navegador del Usuario. Los titulares de dichas redes sociales disponen de sus propias políticas de protección de datos y de cookies, siendo ellos mismos, en cada caso, responsables de sus propios ficheros y de sus propias prácticas de privacidad. El Usuario debe referirse a las mismas para informarse acerca de dichas cookies y, en su caso, del tratamiento de sus datos personales. Únicamente a título informativo se indican a continuación los enlaces en los que se pueden consultar dichas políticas de privacidad y/o de cookies (según sea el caso):</p><ul>
<li><b>Facebook:</b> <a class="lk" href="https://www.facebook.com/policies/cookies/" target="_blank" rel="noopener">facebook.com/policies/cookies</a></li><li><b>Twitter:</b> <a class="lk" href="https://twitter.com/es/privacy" target="_blank" rel="noopener">twitter.com/es/privacy</a></li><li><b>Instagram:</b> <a class="lk" href="https://help.instagram.com/1896641480634370?ref=ig" target="_blank" rel="noopener">help.instagram.com</a></li><li><b>YouTube:</b> <a class="lk" href="https://policies.google.com/privacy?hl=es-419&gl=mx" target="_blank" rel="noopener">policies.google.com/privacy</a></li><li><b>Pinterest:</b> <a class="lk" href="https://policy.pinterest.com/es/privacy-policy" target="_blank" rel="noopener">policy.pinterest.com</a></li><li><b>LinkedIn:</b> <a class="lk" href="https://www.linkedin.com/legal/cookie-policy?trk=hp-cookies" target="_blank" rel="noopener">linkedin.com/legal/cookie-policy</a></li></ul>
<h3 class="h">Deshabilitar, rechazar y eliminar cookies</h3><p>El Usuario puede deshabilitar, rechazar y eliminar las cookies, total o parcialmente, instaladas en su dispositivo mediante la configuración de su navegador (entre los que se encuentran, por ejemplo, Chrome, Firefox, Safari, Explorer). En este sentido, los procedimientos para rechazar y eliminar las cookies pueden diferir de un navegador de Internet a otro. En consecuencia, el Usuario debe acudir a las instrucciones facilitadas por el propio navegador de Internet que esté utilizando. En el supuesto de que rechace el uso de cookies, total o parcialmente, podrá seguir usando el Sitio Web, si bien podrá tener limitada la utilización de algunas de las prestaciones de este.</p><p>Puede gestionar su elección en ${lk('pers','Personalizar cookies')}.</p>`}

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vybra · Competiciones deportivas en España</title>
<style>
:root{--bg:#0a0a0b;--card:#161619;--line:#2a2a30;--red:#e5121b;--red2:#ff3b3b;--ink:#f6f2f0;--mut:#a3a2a9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI","Helvetica Neue",Arial,sans-serif}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font:italic 900 26px "Arial Black",Impact,sans-serif;letter-spacing:-.02em}.logo i{color:var(--red2)}.top span{color:var(--mut);font-size:13px}
.view{flex:1;min-height:0;overflow:auto;position:relative}
.pg{max-width:760px;margin:0 auto;padding:14px 14px 28px}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:0;color:var(--mut);padding:8px 0 9px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button b{font-size:20px;font-weight:400;filter:grayscale(1)}nav button.on{color:var(--red2);box-shadow:inset 0 3px 0 var(--red)}nav button.on b{filter:none}
#map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#0d0d0f repeating-linear-gradient(0deg,#1e1e23 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,#1e1e23 0 1px,transparent 1px 64px)}
#lay,#tiles{position:absolute;inset:0}#tiles img{position:absolute;width:256px;height:256px;user-select:none}
.pin{position:absolute;transform:translate(-50%,-100%);border:3px solid #fff;background:var(--red);border-radius:50% 50% 50% 4px;width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:0 4px 14px #000a;rotate:-45deg}
.pin em{display:block;rotate:45deg;font-style:normal}
.pin span{position:absolute;rotate:45deg;left:34px;top:-30px;white-space:nowrap;background:#000c;color:#fff;font:700 12px sans-serif;padding:3px 8px;border-radius:6px;transform-origin:0 0}
.zc{position:absolute;right:10px;top:10px;display:grid;gap:6px}.zc button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#000c;color:#fff;font-size:20px;cursor:pointer}
.attr{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
#mnote{position:absolute;left:12px;right:60px;bottom:26px;background:#000d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut)}
.seg{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -14px 14px;padding:0 6px}
.seg button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}.seg .on{color:#fff;border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin:0 0 10px}
.ev{display:flex;gap:12px;cursor:pointer;border-left:4px solid var(--red)}.ev h3{margin:0;font-size:16px}.ev p{margin:2px 0 0;font-size:13px}.m{color:var(--mut)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#0f0f11;border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red2);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-weight:800;padding:13px;margin-top:14px;cursor:pointer}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.bk{position:fixed;inset:0;background:#000b;z-index:8}
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:720px;margin:0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sh{background:linear-gradient(135deg,#e5121b,#5a0409);padding:18px 16px}.sh h2{margin:0;font-size:22px}.sh p{margin:4px 0 0;opacity:.9}
.sb{padding:4px 16px}.sb h3{font-size:13px;color:var(--mut);margin:18px 0 6px;font-weight:700}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.rd{display:flex;gap:6px}.rd div{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:12px}.rd b{display:block;font-size:17px;color:var(--red2)}
.lv{position:relative;height:12px;border-radius:9px;background:linear-gradient(90deg,#333,#777)}.lv i{position:absolute;top:-3px;bottom:-3px;border:2px solid var(--red2);background:#e5121b66;border-radius:6px}
.lvs{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800}
.pz{margin:0;padding:0;list-style:none}.pz li{padding:8px 0;border-bottom:1px solid var(--line)}
.post{border-top:1px solid var(--line);padding:9px 0;white-space:pre-wrap}.post small{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;padding:10px 16px;border-radius:99px;z-index:20;font-weight:700}
.back{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;background:var(--card)}.h{font-size:13px;color:var(--mut);margin:18px 0 6px}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.x{background:none;border:0;color:var(--red2);cursor:pointer;font:inherit;padding:6px 0}summary{cursor:pointer}h3{font-size:15px}
.slg{display:block;color:var(--mut);font-size:11px;margin-top:-2px}.tr{display:flex;align-items:center;gap:10px;text-align:right;font-size:12px;color:var(--mut);line-height:1.2}.tr b{color:var(--ink);font-size:15px}
.dd{background:var(--red);color:#fff;border:0;border-radius:99px;padding:8px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.mf{position:absolute;z-index:3;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}.mf button{border:1px solid var(--line);background:#000c;color:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}.mf .on{background:var(--red);border-color:var(--red)}
.dr{position:fixed;z-index:9;top:0;right:0;bottom:0;width:min(400px,92%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding-top:env(safe-area-inset-top,0px)}.drh{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:17px}
@media(prefers-reduced-motion:no-preference){.dr{animation:inr .28s cubic-bezier(.2,.8,.2,1)}@keyframes inr{from{transform:translateX(100%)}}}
.nt{position:absolute;z-index:3;right:62px;top:10px;bottom:10px;width:260px;background:#000b;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.nth{padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line);color:#fff}
.ntb{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
.tk{animation:down linear infinite}.nt:hover .tk{animation-play-state:paused}
.ni{padding:10px 12px;border-bottom:1px solid #fff2;cursor:pointer;color:#fff}.ni small{display:block;color:var(--red2);font-weight:700;font-size:11px}.ni b{display:block;font-size:14px}.ni span{font-size:12px;color:#ccc}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.pin span{display:none}#map.lb .pin span,.pin:hover span{display:block}
@media(max-width:860px){.nt{display:none}}
@media(prefers-reduced-motion:reduce){.tk{animation:none}.ntb{overflow:auto}}
</style></head><body>
<div class="top"><div><div class="logo">V<i>y</i>bra</div><small class="slg">Compite. Conecta. Vibra.</small></div><div class="tr"><div id="clk"></div><button class="dd" data-a="drawer" aria-label="Servicios">Servicios ▾</button></div></div>
<div class="view" id="view"></div><nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const SP={Atletismo:'🏃',Ciclismo:'🚴',Natación:'🏊',Trail:'⛰️',Otros:'✨'};
const PV=Object.fromEntries('A Coruña:43.37:-8.40|Álava:42.85:-2.67|Albacete:38.99:-1.86|Alicante:38.35:-0.48|Almería:36.84:-2.46|Asturias:43.36:-5.85|Ávila:40.66:-4.70|Badajoz:38.88:-6.97|Barcelona:41.39:2.17|Bizkaia:43.26:-2.93|Burgos:42.34:-3.70|Cáceres:39.47:-6.37|Cádiz:36.53:-6.29|Cantabria:43.46:-3.81|Castellón:39.99:-0.04|Ceuta:35.89:-5.32|Ciudad Real:38.99:-3.93|Córdoba:37.89:-4.78|Cuenca:40.07:-2.14|Gipuzkoa:43.32:-1.98|Girona:41.98:2.82|Granada:37.18:-3.60|Guadalajara:40.63:-3.17|Huelva:37.26:-6.94|Huesca:42.14:-0.41|Illes Balears:39.57:2.65|Jaén:37.78:-3.79|La Rioja:42.47:-2.45|Las Palmas:28.12:-15.43|León:42.60:-5.57|Lleida:41.62:0.62|Lugo:43.01:-7.56|Madrid:40.42:-3.70|Málaga:36.72:-4.42|Melilla:35.29:-2.94|Murcia:37.99:-1.13|Navarra:42.82:-1.64|Ourense:42.34:-7.86|Palencia:42.01:-4.53|Pontevedra:42.43:-8.64|Salamanca:40.97:-5.66|Santa Cruz de Tenerife:28.47:-16.25|Segovia:40.95:-4.12|Sevilla:37.39:-5.98|Soria:41.76:-2.47|Tarragona:41.12:1.25|Teruel:40.34:-1.11|Toledo:39.86:-4.02|Valencia:39.47:-0.38|Valladolid:41.65:-4.72|Zamora:41.50:-5.75|Zaragoza:41.65:-0.88|Fuera de España:40:-3'.split('|').map(s=>{const[n,a,o]=s.split(':');return[n,[+a,+o]]}));
// Códigos de acceso de demostración. Al ser una web estática NO son seguros: para producción usa un login real.
const PINS={org:'organizador2026',admin:'vybra2026'},FC=['Horarios','Recorrido','Premios','General'],NC=['Salud','Deporte','Nutrición','Bienestar'];
let S={ev:[],reg:[],posts:[],news:[],me:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('vybra2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('vybra2',JSON.stringify(S))}catch(e){}};
if(!S.home)S.home='Madrid';
let tab='mapa',page=null,sport='',fedf='',drawer=false,dtab='n',amb='',lrole='user',Z=6,C=[40.2,-3.7],dr=null,role='',orgName='';
const $=i=>document.getElementById(i),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const toast=t=>{$('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('toast').innerHTML='',2400)};
const regs=e=>S.reg.filter(r=>r.eid==e.id),mine=e=>S.me&&regs(e).some(r=>r.email==S.me.email);
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`,opt=a=>a.map(k=>`<option>${esc(k)}</option>`).join('');
/* mapa */
const TS=256,mp=(la,lo,z)=>{const s=TS*2**z,r=la*Math.PI/180;return[(lo+180)/360*s,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s]};
const un=(x,y,z)=>{const s=TS*2**z,n=Math.PI-2*Math.PI*y/s;return[180/Math.PI*Math.atan(Math.sinh(n)),x/s*360-180]};
function drawMap(){const m=$('map');if(!m)return;const w=m.clientWidth,h=m.clientHeight,[cx,cy]=mp(C[0],C[1],Z),x0=cx-w/2,y0=cy-h/2,n=2**Z;let t='';
for(let x=Math.floor(x0/TS);x<=Math.floor((x0+w)/TS);x++)for(let y=Math.floor(y0/TS);y<=Math.floor((y0+h)/TS);y++){if(y<0||y>=n)continue;
t+=`<img draggable="false" alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${Z}/${y}/${((x%n)+n)%n}" style="left:${Math.round(x*TS-x0)}px;top:${Math.round(y*TS-y0)}px" onerror="this.remove();$('mnote').hidden=false">`}
t+=S.ev.filter(inAmb).map(e=>{const[px,py]=mp(e.lat,e.lon,Z);return `<button class="pin" data-a="ev" data-v="${e.id}" style="left:${px-x0}px;top:${py-y0}px"><em>${SP[e.sp]||'✨'}</em><span>${esc(e.nm)}</span></button>`}).join('');
$('tiles').innerHTML=t;m.classList.toggle('lb',Z>=9);$('lay').style.transform=''}
const zoom=d=>{Z=Math.max(4,Math.min(18,Z+d));drawMap()};
document.addEventListener('pointerdown',e=>{if(e.target.closest('#map')&&!e.target.closest('.zc,.mf,.nt'))dr={x:e.clientX,y:e.clientY,d:0}});
addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr.d=Math.hypot(dx,dy);if(dr.d>5)$('lay').style.transform=`translate(${dx}px,${dy}px)`});
addEventListener('pointerup',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y,mv=dr.d>5;dr=null;if(!mv)return;const[cx,cy]=mp(C[0],C[1],Z);C=un(cx-dx,cy-dy,Z);drawMap()});
document.addEventListener('wheel',e=>{if(e.target.closest('#map')&&!e.target.closest('.nt')){e.preventDefault();zoom(e.deltaY<0?1:-1)}},{passive:false});
addEventListener('resize',drawMap);
const vMapa=()=>`<div id="map"><div class="mf">${ambBar()}</div><aside class="nt"><div class="nth">📌 Tablón de noticias</div><div class="ntb">${tk()}</div></aside><div id="lay"><div id="tiles"></div></div><div class="zc"><button data-a="z" data-v="1" aria-label="Acercar">+</button><button data-a="z" data-v="-1" aria-label="Alejar">−</button><button data-a="ctr" aria-label="Centrar en España">◎</button></div><div id="mnote" hidden>Las imágenes de satélite no cargan en esta vista previa; sí lo hacen al alojar la página en tu dominio.</div><div class="attr">Imagen: Esri, Maxar</div></div>`;
/* capa 1b: eventos */
const card=e=>`<article class="card ev" data-a="ev" data-v="${e.id}"><div style="font-size:28px">${SP[e.sp]||'✨'}</div><div><h3>${esc(e.nm)}</h3><p>${fd(e.dt)} · ${esc(e.loc?e.loc+', ':'')}${esc(e.pv)}</p><p class="m">${esc(e.org)} · <span class="tag">${esc(e.fed)}</span>${e.dist?' · '+esc(e.dist):''}</p></div></article>`;
function vEv(){const l=S.ev.filter(e=>(!sport||e.sp==sport)&&(!fedf||e.fed==fedf)&&inAmb(e)).sort((a,b)=>a.dt.localeCompare(b.dt));
return `<div class="pg"><div class="row" style="margin-bottom:12px"><button class="btn" style="margin:0" data-a="role" data-v="user">🏃 Inscribirme</button><button class="btn ghost" style="margin:0" data-a="role" data-v="org">🏢 Publicar mi competición</button></div>${ambBar(1)}<div class="seg">${['',...Object.keys(SP)].map(k=>`<button class="${sport==k?'on':''}" data-a="sport" data-v="${k}">${k?SP[k]+' '+k:'Todos'}</button>`).join('')}</div><div class="seg">${['','Federada','No federada'].map(k=>`<button class="${fedf==k?'on':''}" data-a="fedf" data-v="${k}">${k||'Todas'}</button>`).join('')}</div>${l.length?l.map(card).join(''):empty('Todavía no hay competiciones','Cuando un organizador publique la primera, aparecerá aquí y en el mapa.')}</div>`}
/* capa 2: ficha + inscripción */
function vEvPage(){const e=S.ev.find(x=>x.id==page.id);if(!e){page=null;return vEv()}const n=regs(e).length,full=e.cap&&n>=e.cap;
return `<div class="back" data-a="back">← Volver</div><div class="sh"><span class="tag" style="background:#000">${SP[e.sp]||''} ${esc(e.sp)} · ${esc(e.fed)}</span><h2>${esc(e.nm)}</h2><p>${fd(e.dt)}</p></div><div class="pg">
<p style="margin:0">📍 ${esc(e.loc?e.loc+', ':'')}${esc(e.pv)}<br>🏢 Organiza ${esc(e.org)}</p><p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${esc(gmu(e))}" target="_blank" rel="noopener">📍 Cómo llegar (Google Maps)</a><span class="m" style="font-size:12px">${e.ex?'Ubicación exacta confirmada':'Ubicación aproximada (localidad): el organizador debe confirmar el punto exacto'}</span></p>${e.ds?`<p class="m" style="white-space:pre-wrap">${esc(e.ds)}</p>`:''}${/^https?:\/\//.test(e.url||'')?`<p><a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:var(--red2)">Más información e inscripción</a></p>`:''}
${e.dist?`<h3 class="h">Distancias</h3><p style="margin:0">${esc(e.dist)}</p>`:''}
${liveBox(e)}<h3 class="h">Participación</h3>${e.cap?`<div class="bar"><i style="width:${Math.min(100,n/e.cap*100)}%"></i></div><p style="margin:6px 0 0"><b>${n} de ${e.cap} inscritos</b> · <span class="tag">${Math.max(e.cap-n,0)} plazas libres</span></p>`:`<p style="margin:0"><b>${n} inscritos</b> · sin límite de plazas</p>`}
${e.pz?`<h3 class="h">Premios</h3><ul class="pz">${e.pz.split('\n').map(l=>`<li>🏆 ${esc(l)}</li>`).join('')}</ul>`:''}
<h3 class="h">Inscripción</h3>${mine(e)?`<p><b>Ya estás inscrito.</b></p><button class="btn" data-a="forum" data-v="${e.id}">Entrar al foro</button>`:full?'<p><b>Plazas agotadas.</b></p>':`<form class="card" data-f="reg" data-id="${e.id}"><label>Nombre y apellidos</label><input name="nm" required value="${esc(S.me?.name)}"><label>Email</label><input name="em" type="email" required value="${esc(S.me?.email)}">${e.dist?`<label>Distancia</label><select name="dist">${opt(e.dist.split(',').map(s=>s.trim()).filter(Boolean))}</select>`:''}${e.fed=='Federada'?'<label>Nº de licencia federativa</label><input name="lic" required>':''}<button class="btn">Inscribirme</button></form>`}</div>`}
/* capa 3: foro */
function vForoPage(){const e=S.ev.find(x=>x.id==page.id);if(!e||!(mine(e)||canMod(e))){page=null;return vForo()}const ps=S.posts.filter(p=>p.eid==e.id).sort((a,b)=>b.ts-a.ts);
return `<div class="back" ${canMod(e)&&tab=='acc'?'data-a="back"':`data-a="ev" data-v="${e.id}"`}>← ${canMod(e)&&tab=='acc'?'Panel':'Ficha del torneo'}</div><div class="sh"><h2>💬 Foro · ${esc(e.nm)}</h2><p>${canMod(e)?'Respondes como '+(role=='admin'?'Equipo Vybra':'organizador'):'Solo para inscritos'}</p></div><div class="pg"><form class="card" data-f="post" data-id="${e.id}"><select name="c">${opt(FC)}</select><textarea name="x" rows="3" required placeholder="Horarios, recorrido, dudas…" style="margin-top:8px"></textarea><button class="btn">Publicar mensaje</button></form>${ps.length?ps.map(p=>`<div class="post"><b>${esc(p.a)}</b> ${p.st?'<span class="tag" style="background:#fff;color:#000">Organización</span> ':''}<span class="tag">${esc(p.c)}</span> <small>${new Date(p.ts).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small><br>${esc(p.x)}</div>`).join(''):empty('Aún no hay mensajes','Escribe el primero.')}</div>`}

const vNews=()=>`<div class="pg"><h2 style="margin:0 0 10px">📌 Tablón de noticias</h2>${liveList()}${S.news.length?S.news.slice().sort((a,b)=>b.ts-a.ts).map(n=>`<article class="card"><span class="tag">${esc(n.c)}</span><h3 style="margin:6px 0">${esc(n.t)}</h3><p style="white-space:pre-wrap;margin:0">${esc(n.x)}</p><p class="m" style="font-size:12px">${esc(n.a)} · ${new Date(n.ts).toLocaleDateString('es-ES')}</p></article>`).join(''):empty('Sin noticias todavía','Aquí irán las noticias de salud y deporte.')}</div>`;
